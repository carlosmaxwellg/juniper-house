<script>
  (function () {
    const root = document.getElementById('jh-wireframes');
    const stage = document.getElementById('jh-stage');
    const site = document.getElementById('jh-site');
    const address = document.getElementById('jh-address');
    const paths = {
      home: '/',
      concern: '/concerns/uneven-tone-sun-damage',
      treatment: '/treatments/medical-microneedling',
      consultation: '/consultation',
      approach: '/approach',
      about: '/about',
      booking: '/book'
    };

    function addShared(id) {
      const fragment = document.getElementById(id).content.cloneNode(true);
      site.appendChild(fragment);
    }

    function renderPage(page) {
      site.innerHTML = '';
      addShared('jh-shared-header');
      const pageTemplate = document.getElementById('jh-page-' + page);
      site.appendChild(pageTemplate.content.cloneNode(true));
      if (page !== 'booking') addShared('jh-shared-footer');
      address.textContent = 'juniperhouse.example' + paths[page];
      if (page === 'booking') {
        wireBookingControls();
        renderBookingStep(1);
      }
    }

    function renderBookingStep(step) {
      const content = document.getElementById('jh-book-content');
      if (!content) return;
      content.innerHTML = '';
      content.appendChild(document.getElementById('jh-book-' + step).content.cloneNode(true));
      const progressItems = Array.from(document.querySelectorAll('#jh-book-progress .jh-progress-item'));
      progressItems.forEach(function (item, index) {
        item.classList.toggle('is-active', index <= step - 1);
      });
      root.querySelectorAll('.jh-booking-step').forEach(function (button) {
        button.setAttribute('aria-pressed', button.dataset.bookStep === String(step) ? 'true' : 'false');
      });
    }

    function wireBookingControls() {
      root.querySelectorAll('.jh-booking-step').forEach(function (button) {
        button.addEventListener('click', function () {
          renderBookingStep(Number(button.dataset.bookStep));
        });
      });
    }

    document.getElementById('jh-page-controls').addEventListener('click', function (event) {
      const button = event.target.closest('[data-page]');
      if (!button) return;
      root.querySelectorAll('[data-page]').forEach(function (candidate) {
        candidate.setAttribute('aria-pressed', candidate === button ? 'true' : 'false');
      });
      renderPage(button.dataset.page);
    });

    document.getElementById('jh-view-controls').addEventListener('click', function (event) {
      const button = event.target.closest('[data-view]');
      if (!button) return;
      root.querySelectorAll('[data-view]').forEach(function (candidate) {
        candidate.setAttribute('aria-pressed', candidate === button ? 'true' : 'false');
      });
      stage.dataset.view = button.dataset.view;
    });

    renderPage('home');
  }());
</script>
